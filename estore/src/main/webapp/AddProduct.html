<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Add Product</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body class="product-body">


<div class="product-card">


<div class="product-icon">
<i class="fa-solid fa-cart-plus"></i>
</div>


<h1>Add Product</h1>

<p>Add new product details</p>


<form action="addproduct" method="post">


<div class="product-input">
<i class="fa-solid fa-barcode"></i>
<input type="text" name="pcode" placeholder="Product Code">
</div>



<div class="product-input">
<i class="fa-solid fa-box"></i>
<input type="text" name="pname" placeholder="Product Name">
</div>



<div class="product-input">
<i class="fa-solid fa-building"></i>
<input type="text" name="pcompany" placeholder="Company Name">
</div>



<div class="product-input">
<i class="fa-solid fa-indian-rupee-sign"></i>
<input type="text" name="pprice" placeholder="Price">
</div>



<div class="product-input">
<i class="fa-solid fa-layer-group"></i>
<input type="text" name="pqty" placeholder="Quantity">
</div>



<button class="add-product-btn">
<i class="fa-solid fa-plus"></i>
Add Product
</button>


</form>


</div>


</body>
</html>
