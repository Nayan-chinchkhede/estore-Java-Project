<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Customer Login</title>

<style>

body{
    background: linear-gradient(to right,#667eea,#764ba2);
    font-family: Arial;
}

.login-box{
    width:350px;
    background:white;
    padding:30px;
    margin-top:120px;
    border-radius:15px;
    box-shadow:0px 0px 15px black;
}

h1{
    color:#333;
}

input[type="text"],
input[type="password"]{
    width:90%;
    padding:12px;
    margin:10px;
    border-radius:8px;
    border:1px solid gray;
    font-size:16px;
}


input[type="submit"]{
    width:95%;
    padding:12px;
    background:#667eea;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

input[type="submit"]:hover{
    background:#764ba2;
}


a{
    text-decoration:none;
    color:#667eea;
    font-size:18px;
}

label{
    font-size:17px;
}

</style>

</head>

<body>

<center>

<div class="login-box">

<h1>
<u>Customer Login</u>
</h1>


<form action="clog" method="post">

<label>User Name</label>
<input type="text" name="uname" placeholder="Enter Username">


<label>Password</label>
<input type="password" name="upass" placeholder="Enter Password">


<input type="submit" value="Login">

</form>


<br>

<a href="CustomerRegister.html">
New Customer Register
</a>


</div>

</center>

</body>
</html>
